<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b1c"/>
      <stop offset="100%" stop-color="#050710"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Dot grid -->
  <pattern id="dots3" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#0d1030"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots3)" opacity="0.9"/>

  <!-- Subtle glow behind doc -->
  <ellipse cx="400" cy="228" rx="100" ry="90" fill="#7c3aed" opacity="0.07" filter="url(#glow3)"/>

  <!-- Central: Document icon -->
  <g transform="translate(400, 228)">
    <!-- Document body -->
    <rect x="-48" y="-70" width="96" height="120" rx="8" fill="url(#docGrad)" stroke="#4c1d95" stroke-width="1.5"/>

    <!-- Document lines (content) -->
    <line x1="-30" y1="-48" x2="30" y2="-48" stroke="#6d28d9" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-32" x2="18" y2="-32" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-30" y1="-18" x2="24" y2="-18" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-30" y1="-4" x2="12" y2="-4" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Citation marks (quote marks) -->
    <text x="-34" y="22" fill="#7c3aed" font-size="14" font-family="Georgia, serif" opacity="0.7">"</text>
    <text x="22" y="34" fill="#7c3aed" font-size="14" font-family="Georgia, serif" opacity="0.7">"</text>
    <line x1="-26" y1="26" x2="26" y2="26" stroke="#4c1d95" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <line x1="-26" y1="36" x2="26" y2="36" stroke="#4c1d95" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

    <!-- Verification checkmark circle (overlapping) -->
    <circle cx="38" cy="-50" r="28" fill="#022c22" stroke="#10b981" stroke-width="2"/>
    <polyline points="25,-50 35,-38 52,-62" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- NLI badge below check -->
    <rect x="-38" y="60" width="76" height="20" rx="10" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
    <text x="0" y="74" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">NLI VERIFIED</text>
  </g>

  <!-- Three small claim nodes scattered -->
  <g opacity="0.5">
    <!-- Claim 1 (published) -->
    <rect x="168" y="180" width="60" height="22" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="198" y="195" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">claim ✓</text>
    <line x1="228" y1="191" x2="340" y2="218" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Claim 2 (withheld) -->
    <rect x="168" y="228" width="60" height="22" rx="5" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="198" y="243" text-anchor="middle" fill="#f87171" font-size="8" font-family="monospace">withheld</text>
    <line x1="228" y1="239" x2="340" y2="228" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Claim 3 (published) -->
    <rect x="574" y="180" width="60" height="22" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="604" y="195" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">claim ✓</text>
    <line x1="460" y1="218" x2="574" y2="191" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Claim 4 (withheld) -->
    <rect x="574" y="228" width="60" height="22" rx="5" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="604" y="243" text-anchor="middle" fill="#f87171" font-size="8" font-family="monospace">withheld</text>
    <line x1="460" y1="228" x2="574" y2="239" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>

  <!-- Top label -->
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui" letter-spacing="0.12em">PERSONAL PROJECT</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="system-ui" font-weight="700">Agentic Research Engine</text>
  <text x="400" y="148" text-anchor="middle" fill="#64748b" font-size="13" font-family="system-ui">LangGraph pipeline · NLI entailment · zero unsupported claims published</text>

  <!-- Bottom strip -->
  <rect x="0" y="400" width="800" height="50" fill="#040610"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#0d1030" stroke-width="1"/>

  <g font-family="system-ui" font-size="11" fill="#475569">
    <text x="56" y="431">LangGraph</text>
    <circle cx="126" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="136" y="431">LangChain</text>
    <circle cx="204" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="214" y="431">Tavily</text>
    <circle cx="253" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="263" y="431">FastAPI</text>
    <circle cx="312" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="322" y="431">React</text>
    <circle cx="360" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="370" y="431">NLI / entailment</text>
    <circle cx="468" cy="427" r="1.5" fill="#1e1b4b"/>
    <text x="478" y="431">Python</text>
  </g>

  <!-- Violet accent line -->
  <rect x="0" y="0" width="800" height="3" fill="#7c3aed" opacity="0.6"/>
</svg>
