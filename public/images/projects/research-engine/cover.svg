<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <marker id="arrW" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Grid -->
  <g stroke="#1e3a5f" stroke-width="0.4" opacity="0.25">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title -->
  <text x="40" y="52" fill="#f8fafc" font-size="22" font-family="system-ui" font-weight="700">Agentic Research Engine</text>
  <text x="40" y="73" fill="#94a3b8" font-size="12" font-family="system-ui">LangGraph pipeline with NLI entailment verification — zero unsupported claims published</text>

  <!-- Badges -->
  <rect x="40" y="88" width="72" height="20" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="76" y="102" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui" font-weight="600">LangGraph</text>
  <rect x="122" y="88" width="58" height="20" rx="10" fill="#0c1a2e" stroke="#60a5fa" stroke-width="1"/>
  <text x="151" y="102" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="system-ui" font-weight="600">LangChain</text>
  <rect x="190" y="88" width="56" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="218" y="102" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="system-ui" font-weight="600">NLI / NER</text>
  <rect x="256" y="88" width="54" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="283" y="102" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui" font-weight="600">FastAPI</text>
  <rect x="320" y="88" width="50" height="20" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="345" y="102" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui" font-weight="600">Tavily</text>

  <!-- Pipeline: 3 rows -->
  <!-- Row 1: question → contract → queries -->
  <rect x="40" y="135" width="90" height="36" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="85" y="150" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">ANALYZE</text>
  <text x="85" y="162" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">+ CONTRACT</text>

  <line x1="130" y1="153" x2="158" y2="153" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrW)"/>

  <rect x="158" y="135" width="90" height="36" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="203" y="150" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">PLAN</text>
  <text x="203" y="162" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">RESEARCH</text>

  <line x1="248" y1="153" x2="276" y2="153" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrW)"/>

  <rect x="276" y="135" width="90" height="36" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="321" y="150" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">GENERATE</text>
  <text x="321" y="162" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">QUERIES</text>

  <!-- Row 2: parallel workers (fan-out) -->
  <line x1="366" y1="153" x2="394" y2="153" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrW)"/>

  <!-- Fan-out -->
  <line x1="394" y1="153" x2="420" y2="120" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="394" y1="153" x2="420" y2="153" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="394" y1="153" x2="420" y2="186" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 3 parallel search workers -->
  <rect x="420" y="106" width="80" height="28" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="460" y="124" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker</text>
  <rect x="420" y="139" width="80" height="28" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="460" y="157" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker</text>
  <rect x="420" y="172" width="80" height="28" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="460" y="190" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker</text>

  <!-- Fan-in barrier 1 -->
  <line x1="500" y1="120" x2="520" y2="153" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="500" y1="153" x2="520" y2="153" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="500" y1="186" x2="520" y2="153" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="520" y="136" width="90" height="34" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="565" y="150" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="monospace" font-weight="600">DEDUPE</text>
  <text x="565" y="162" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">fan-in barrier</text>

  <!-- Row 3: extract → assess → synthesize -->
  <line x1="610" y1="153" x2="638" y2="153" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrW)"/>

  <rect x="638" y="135" width="90" height="36" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="683" y="150" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">EXTRACT</text>
  <text x="683" y="162" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">exact quotes</text>

  <!-- Down to synthesize row -->
  <line x1="683" y1="171" x2="683" y2="200" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrW)"/>

  <!-- Synthesize row -->
  <rect x="560" y="200" width="90" height="36" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="605" y="215" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace">SYNTHESIZE</text>
  <text x="605" y="227" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">claims + quotes</text>

  <line x1="605" y1="236" x2="605" y2="262" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrW)"/>

  <!-- NLI verifier -->
  <rect x="510" y="262" width="190" height="40" rx="8" fill="#1a1a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="605" y="279" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="monospace" font-weight="600">NLI ENTAILMENT CLASSIFIER</text>
  <text x="605" y="292" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">claim entailed by own citation?  ≥0.996 threshold</text>

  <!-- Publication gate -->
  <line x1="605" y1="302" x2="605" y2="328" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG3)"/>

  <rect x="510" y="328" width="190" height="36" rx="8" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="605" y="343" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace" font-weight="600">PUBLICATION GATE</text>
  <text x="605" y="355" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">relevance check  ·  withheld if fails</text>

  <!-- Reject path -->
  <line x1="700" y1="282" x2="745" y2="282" stroke="#f87171" stroke-width="1"/>
  <rect x="745" y="270" width="20" height="24" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="755" y="285" text-anchor="middle" fill="#f87171" font-size="14">✕</text>

  <!-- Budget loop back-edge label -->
  <text x="40" y="223" fill="#64748b" font-size="9" font-family="monospace">if coverage gaps + budget left:</text>
  <path d="M 40 230 Q 200 268 321 171" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrW)" opacity="0.6"/>

  <!-- Stat row at bottom left -->
  <rect x="40" y="340" width="150" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="115" y="364" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="system-ui" font-weight="700">1.00</text>
  <text x="115" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">precision (blinded review)</text>
  <text x="115" y="393" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">0 unsupported claims published</text>

  <rect x="204" y="340" width="150" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="279" y="364" text-anchor="middle" fill="#10b981" font-size="20" font-family="system-ui" font-weight="700">11/21</text>
  <text x="279" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">candidates published</text>
  <text x="279" y="393" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">10 withheld (not entailed)</text>

  <rect x="368" y="340" width="140" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="438" y="364" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="system-ui" font-weight="700">3 modes</text>
  <text x="438" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">local / cloud / hybrid</text>
  <text x="438" y="393" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">local = no API key needed</text>
</svg>
