<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <marker id="aW" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#a78bfa"/>
    </marker>
    <marker id="aG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#10b981"/>
    </marker>
    <marker id="aB2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#60a5fa"/>
    </marker>
    <marker id="aR2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="url(#bgArch)" rx="10"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="system-ui" font-weight="700">Agentic Research Engine — LangGraph Pipeline</text>
  <text x="450" y="54" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui">Two-model design: generative model writes claims · separate classifier decides publication</text>

  <!-- ===== STAGE 1: Question Analysis ===== -->
  <rect x="24" y="80" width="120" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="84" y="100" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">analyze_query</text>
  <text x="84" y="113" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">build answer</text>
  <text x="84" y="124" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">contract</text>

  <line x1="144" y1="106" x2="172" y2="106" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aW)"/>

  <rect x="172" y="80" width="110" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="227" y="100" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">plan_research</text>
  <text x="227" y="113" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">decompose into</text>
  <text x="227" y="124" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">sub-questions</text>

  <line x1="282" y1="106" x2="310" y2="106" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aW)"/>

  <rect x="310" y="80" width="110" height="52" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="365" y="100" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">generate_queries</text>
  <text x="365" y="113" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">search strings</text>
  <text x="365" y="124" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">per sub-question</text>

  <!-- ===== STAGE 2: Parallel Search (fan-out) ===== -->
  <!-- Fan-out lines -->
  <line x1="420" y1="106" x2="460" y2="106" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="106" x2="460" y2="78" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="460" y1="106" x2="460" y2="136" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="460" y="62" width="100" height="32" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="510" y="76" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker ①</text>
  <text x="510" y="88" text-anchor="middle" fill="#475569" font-size="7" font-family="monospace">Tavily API</text>

  <rect x="460" y="98" width="100" height="32" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="510" y="112" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker ②</text>
  <text x="510" y="124" text-anchor="middle" fill="#475569" font-size="7" font-family="monospace">Tavily API</text>

  <rect x="460" y="134" width="100" height="32" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="510" y="148" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">search_worker ③</text>
  <text x="510" y="160" text-anchor="middle" fill="#475569" font-size="7" font-family="monospace">Tavily API</text>

  <!-- Fan-in to dedupe -->
  <line x1="560" y1="78" x2="590" y2="106" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="560" y1="114" x2="590" y2="106" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="560" y1="150" x2="590" y2="106" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Dedupe barrier -->
  <rect x="590" y="82" width="110" height="48" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="645" y="101" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="monospace" font-weight="600">dedupe_sources</text>
  <text x="645" y="114" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">fan-in barrier</text>
  <text x="645" y="124" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">url deduplication</text>

  <line x1="700" y1="106" x2="728" y2="106" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB2)"/>

  <rect x="728" y="82" width="110" height="48" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="783" y="101" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">register_sources</text>
  <text x="783" y="114" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">assign evidence IDs</text>
  <text x="783" y="124" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">model cannot forge</text>

  <!-- ===== STAGE 3: Parallel Fetch ===== -->
  <line x1="783" y1="130" x2="783" y2="176" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aW)"/>

  <!-- fan-out fetch -->
  <line x1="783" y1="176" x2="750" y2="176" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="750" y1="176" x2="750" y2="158" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="750" y1="176" x2="750" y2="194" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="590" y="146" width="155" height="26" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="667" y="163" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">fetch_worker (httpx + trafilatura)</text>

  <rect x="590" y="176" width="155" height="26" rx="5" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
  <text x="667" y="193" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="monospace">fetch_worker (SSRF-guarded)</text>

  <!-- fan-in to extract -->
  <line x1="590" y1="159" x2="570" y2="200" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="590" y1="189" x2="570" y2="200" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- extract_worker barrier -->
  <rect x="430" y="184" width="136" height="38" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="498" y="200" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="monospace" font-weight="600">extract_worker</text>
  <text x="498" y="213" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">exact-normalized quotes only</text>

  <line x1="430" y1="203" x2="398" y2="203" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#aB2)"/>

  <!-- assess_coverage -->
  <rect x="282" y="184" width="116" height="38" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="200" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="monospace" font-weight="600">assess_coverage</text>
  <text x="340" y="213" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">fan-in barrier</text>

  <!-- Budget loop back-edge -->
  <line x1="282" y1="196" x2="256" y2="196" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="256" y1="196" x2="256" y2="64" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="256" y1="64" x2="340" y2="64" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aW)"/>
  <rect x="190" y="48" width="100" height="16" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="0.8"/>
  <text x="240" y="59" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="monospace">if gaps + budget → loop back</text>

  <!-- if sufficient: -->
  <line x1="282" y1="212" x2="172" y2="212" stroke="#10b981" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="226" y="208" text-anchor="middle" fill="#10b981" font-size="7" font-family="monospace">if sufficient →</text>

  <!-- ===== STAGE 4: Synthesis & Verification ===== -->
  <rect x="24" y="192" width="148" height="38" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="98" y="208" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="monospace" font-weight="600">synthesize</text>
  <text x="98" y="221" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">claims + evidence refs (gen model)</text>

  <line x1="98" y1="230" x2="98" y2="268" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#aW)"/>

  <!-- NLI verifier box -->
  <rect x="24" y="268" width="300" height="60" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
  <text x="174" y="290" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="monospace" font-weight="700">NLI ENTAILMENT CLASSIFIER</text>
  <text x="174" y="306" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">pinned model · local or HF endpoint</text>
  <text x="174" y="319" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">claim entailed by own cited quote?  threshold ≥ 0.996</text>

  <!-- Pass/fail branches -->
  <line x1="174" y1="328" x2="174" y2="366" stroke="#10b981" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="145" y="350" fill="#10b981" font-size="9" font-family="monospace">PASS</text>

  <line x1="324" y1="298" x2="380" y2="298" stroke="#f87171" stroke-width="1.5" marker-end="url(#aR2)"/>
  <text x="340" y="290" fill="#f87171" font-size="9" font-family="monospace">FAIL →</text>
  <rect x="380" y="280" width="100" height="36" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="430" y="298" text-anchor="middle" fill="#f87171" font-size="9" font-family="monospace">WITHHELD</text>
  <text x="430" y="310" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">not published</text>

  <!-- Relevance gate -->
  <rect x="24" y="366" width="300" height="52" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="174" y="386" text-anchor="middle" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">RELEVANCE GATE</text>
  <text x="174" y="401" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="monospace">critic model · independent from synthesizer</text>
  <text x="174" y="413" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">fails closed — if judgment unavailable, claims withheld</text>

  <line x1="174" y1="418" x2="174" y2="456" stroke="#10b981" stroke-width="1.5" marker-end="url(#aG)"/>

  <!-- Final published output -->
  <rect x="24" y="456" width="300" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="174" y="476" text-anchor="middle" fill="#10b981" font-size="11" font-family="monospace" font-weight="700">PUBLISHED ANSWER</text>
  <text x="174" y="492" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">atomic claims · citation → exact quote → source URL</text>
  <text x="174" y="505" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">evidence integrity guaranteed by structure, not trust</text>

  <!-- Relevance fail path -->
  <line x1="324" y1="392" x2="380" y2="392" stroke="#f87171" stroke-width="1" marker-end="url(#aR2)"/>
  <rect x="380" y="374" width="100" height="36" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/>
  <text x="430" y="392" text-anchor="middle" fill="#f87171" font-size="9" font-family="monospace">WITHHELD</text>
  <text x="430" y="404" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">irrelevant claim</text>

  <!-- Security annotations -->
  <rect x="500" y="260" width="360" height="200" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="680" y="282" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui" font-weight="700">Security Controls</text>
  <text x="515" y="306" fill="#64748b" font-size="9" font-family="monospace">• SSRF: deny-by-default on loopback / private / multicast</text>
  <text x="515" y="324" fill="#64748b" font-size="9" font-family="monospace">• DNS rebinding: address re-pinned at every redirect hop</text>
  <text x="515" y="342" fill="#64748b" font-size="9" font-family="monospace">• Spend: ceilings reserved before each provider request</text>
  <text x="515" y="360" fill="#64748b" font-size="9" font-family="monospace">• Prompt injection: retrieved text framed as untrusted data</text>
  <text x="515" y="378" fill="#64748b" font-size="9" font-family="monospace">• Extractor has no tools — invented claims fail resolution</text>
  <text x="515" y="396" fill="#64748b" font-size="9" font-family="monospace">• Secrets: gitleaks over full history with positive control</text>
  <text x="515" y="420" fill="#94a3b8" font-size="9" font-family="system-ui" font-weight="600">Modes:</text>
  <rect x="515" y="428" width="52" height="18" rx="9" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="541" y="440" text-anchor="middle" fill="#c4b5fd" font-size="8" font-family="system-ui">local</text>
  <rect x="575" y="428" width="52" height="18" rx="9" fill="#1a1a2e" stroke="#60a5fa" stroke-width="1"/>
  <text x="601" y="440" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="system-ui">cloud</text>
  <rect x="635" y="428" width="52" height="18" rx="9" fill="#1a1a2e" stroke="#10b981" stroke-width="1"/>
  <text x="661" y="440" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="system-ui">hybrid</text>
</svg>
