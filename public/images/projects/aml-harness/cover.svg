<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#1e293b"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)" opacity="0.6"/>

  <!-- Central illustration: bar chart with budget line -->
  <g transform="translate(400, 225)">
    <!-- Budget line (horizontal) -->
    <line x1="-160" y1="-20" x2="160" y2="-20" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="168" y="-16" fill="#fbbf24" font-size="10" font-family="monospace" opacity="0.6">budget k</text>

    <!-- Bar 1 (amber - the model, above budget) -->
    <rect x="-110" y="-90" width="44" height="90" fill="url(#bar1)" rx="3" opacity="0.9"/>
    <!-- Bar 2 -->
    <rect x="-52" y="-60" width="44" height="60" fill="url(#bar2)" rx="3" opacity="0.8"/>
    <!-- Bar 3 -->
    <rect x="8" y="-42" width="44" height="42" fill="url(#bar2)" rx="3" opacity="0.7"/>
    <!-- Bar 4 -->
    <rect x="68" y="-28" width="44" height="28" fill="url(#bar2)" rx="3" opacity="0.6"/>

    <!-- Precision label on tallest bar -->
    <text x="-88" y="-98" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="monospace">precision@k</text>

    <!-- X axis -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#334155" stroke-width="1.5"/>
    <!-- Y axis -->
    <line x1="-140" y1="-105" x2="-140" y2="5" stroke="#334155" stroke-width="1.5"/>

    <!-- Null marker -->
    <line x1="-140" y1="-12" x2="140" y2="-12" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="-148" y="-8" text-anchor="end" fill="#475569" font-size="9" font-family="monospace">null</text>
  </g>

  <!-- Top label -->
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui" letter-spacing="0.12em" text-transform="uppercase">PERSONAL PROJECT</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="system-ui" font-weight="700">AML Evaluation Harness</text>
  <text x="400" y="148" text-anchor="middle" fill="#64748b" font-size="13" font-family="system-ui">Budget-constrained precision@k for transaction monitoring</text>

  <!-- Bottom tag strip -->
  <rect x="0" y="400" width="800" height="50" fill="#0a0e18"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1e293b" stroke-width="1"/>

  <!-- Tags -->
  <g font-family="system-ui" font-size="11" fill="#64748b">
    <text x="56" y="431">LightGBM</text>
    <circle cx="120" cy="427" r="1.5" fill="#334155"/>
    <text x="130" y="431">DuckDB</text>
    <circle cx="188" cy="427" r="1.5" fill="#334155"/>
    <text x="198" y="431">Azure</text>
    <circle cx="237" cy="427" r="1.5" fill="#334155"/>
    <text x="247" y="431">scikit-learn</text>
    <circle cx="319" cy="427" r="1.5" fill="#334155"/>
    <text x="329" y="431">GitHub Actions</text>
    <circle cx="424" cy="427" r="1.5" fill="#334155"/>
    <text x="434" y="431">Python</text>
  </g>

  <!-- Amber accent line at top -->
  <rect x="0" y="0" width="800" height="3" fill="#f59e0b" opacity="0.7"/>
</svg>
