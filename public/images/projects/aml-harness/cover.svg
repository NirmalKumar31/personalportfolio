<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Pipeline flow nodes -->
  <!-- Node 1: Raw Transactions -->
  <rect x="40" y="185" width="100" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="208" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">RAW TXN</text>
  <text x="90" y="220" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">179M rows</text>

  <!-- Arrow -->
  <line x1="140" y1="210" x2="170" y2="210" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 2: Feature Eng -->
  <rect x="170" y="185" width="100" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="208" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">FEATURE</text>
  <text x="220" y="220" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">ENGINEERING</text>

  <!-- Arrow -->
  <line x1="270" y1="210" x2="300" y2="210" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 3: Model Fit -->
  <rect x="300" y="185" width="100" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="208" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">MODEL FIT</text>
  <text x="350" y="220" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">3 seeds</text>

  <!-- Arrow -->
  <line x1="400" y1="210" x2="430" y2="210" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 4: Budget Metric -->
  <rect x="430" y="185" width="110" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="485" y="205" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">PRECISION@k</text>
  <text x="485" y="218" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">budget-aware</text>
  <text x="485" y="229" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">+ null + ceiling</text>

  <!-- Arrow -->
  <line x1="540" y1="210" x2="570" y2="210" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Node 5: Publication Gate -->
  <rect x="570" y="185" width="110" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="625" y="205" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">PUB GATE</text>
  <text x="625" y="218" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">content-addressed</text>
  <text x="625" y="229" text-anchor="middle" fill="#94a3b8" font-size="7" font-family="monospace">provenance check</text>

  <!-- Arrow to deployed -->
  <line x1="680" y1="210" x2="710" y2="210" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="710" y="190" width="68" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="744" y="207" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">EVIDENCE</text>
  <text x="744" y="219" text-anchor="middle" fill="#10b981" font-size="8" font-family="monospace">ARTIFACT</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Stat cards at bottom -->
  <rect x="40" y="290" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="315" text-anchor="middle" fill="#f59e0b" font-size="22" font-family="system-ui" font-weight="700">17.6×</text>
  <text x="120" y="335" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">signal above null (7 active days)</text>

  <rect x="220" y="290" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="315" text-anchor="middle" fill="#10b981" font-size="22" font-family="system-ui" font-weight="700">568</text>
  <text x="300" y="335" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">automated test assertions</text>

  <rect x="400" y="290" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="315" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="system-ui" font-weight="700">179M</text>
  <text x="480" y="335" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">transactions (HI-Large)</text>

  <rect x="580" y="290" width="180" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="670" y="315" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="system-ui" font-weight="700">30.2%</text>
  <text x="670" y="335" text-anchor="middle" fill="#64748b" font-size="10" font-family="system-ui">seed variance, precision@50</text>

  <!-- Title area -->
  <text x="40" y="60" fill="#f8fafc" font-size="22" font-family="system-ui" font-weight="700">AML Evaluation Harness</text>
  <text x="40" y="82" fill="#94a3b8" font-size="12" font-family="system-ui">Budget-constrained alert evaluation for transaction monitoring</text>

  <!-- Badge -->
  <rect x="40" y="100" width="80" height="20" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="114" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="system-ui" font-weight="600">LightGBM</text>
  <rect x="130" y="100" width="60" height="20" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1"/>
  <text x="160" y="114" text-anchor="middle" fill="#10b981" font-size="9" font-family="system-ui" font-weight="600">DuckDB</text>
  <rect x="200" y="100" width="50" height="20" rx="10" fill="#0c1a2e" stroke="#60a5fa" stroke-width="1"/>
  <text x="225" y="114" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="system-ui" font-weight="600">Azure</text>
  <rect x="260" y="100" width="55" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="288" y="114" text-anchor="middle" fill="#818cf8" font-size="9" font-family="system-ui" font-weight="600">Python</text>

  <!-- Temporal split label -->
  <text x="220" y="170" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">ring-aware temporal split</text>
  <line x1="40" y1="178" x2="400" y2="178" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,3"/>
</svg>
