<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <marker id="arrB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrG2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Subtle grid -->
  <g stroke="#1e3a5f" stroke-width="0.4" opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="399" y1="0" x2="399" y2="450"/>
    <line x1="532" y1="0" x2="532" y2="450"/>
    <line x1="665" y1="0" x2="665" y2="450"/>
  </g>

  <!-- Title -->
  <text x="40" y="55" fill="#f8fafc" font-size="22" font-family="system-ui" font-weight="700">Agentic Analytics Engine</text>
  <text x="40" y="76" fill="#94a3b8" font-size="12" font-family="system-ui">Governed analytical Q&amp;A over structured data — no unverified SQL, no fabricated numbers</text>

  <!-- Badges -->
  <rect x="40" y="92" width="72" height="20" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="76" y="106" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="system-ui" font-weight="600">LangGraph</text>
  <rect x="122" y="92" width="56" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="150" y="106" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="system-ui" font-weight="600">DuckDB</text>
  <rect x="188" y="92" width="56" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="216" y="106" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui" font-weight="600">FastAPI</text>
  <rect x="254" y="92" width="44" height="20" rx="10" fill="#0c1a2e" stroke="#60a5fa" stroke-width="1"/>
  <text x="276" y="106" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="system-ui" font-weight="600">MCP</text>
  <rect x="308" y="92" width="50" height="20" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="333" y="106" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="system-ui" font-weight="600">React</text>

  <!-- Rule resolver -->
  <rect x="40" y="145" width="120" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="168" text-anchor="middle" fill="#3b82f6" font-size="9" font-family="monospace" font-weight="600">RULE RESOLVER</text>
  <text x="100" y="184" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">5 states:</text>
  <text x="100" y="196" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">EXACT</text>
  <text x="100" y="207" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">AMBIGUOUS</text>
  <text x="100" y="218" text-anchor="middle" fill="#f87171" font-size="8" font-family="monospace">UNSAFE / UNSUPPORTED</text>
  <text x="100" y="229" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="monospace">UNRESOLVED</text>

  <!-- Question input -->
  <rect x="40" y="278" width="120" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="100" y="294" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace">"What are top 5</text>
  <text x="100" y="306" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="monospace"> products by revenue?"</text>
  <line x1="100" y1="278" x2="100" y2="245" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrB)"/>

  <!-- Arrow right from resolver: EXACT path -->
  <line x1="160" y1="175" x2="195" y2="175" stroke="#6ee7b7" stroke-width="1.5" marker-end="url(#arrG2)"/>

  <!-- Typed contract -->
  <rect x="195" y="155" width="110" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="250" y="172" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">TYPED CONTRACT</text>
  <text x="250" y="185" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">query spec + shape</text>

  <!-- Arrow to DuckDB -->
  <line x1="305" y1="175" x2="340" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG2)"/>

  <!-- DuckDB -->
  <rect x="340" y="155" width="90" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="385" y="172" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">DuckDB</text>
  <text x="385" y="185" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">read-only + MCP</text>

  <!-- Arrow to verify -->
  <line x1="430" y1="175" x2="465" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG2)"/>

  <!-- Verification -->
  <rect x="465" y="155" width="100" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="515" y="172" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace">VERIFICATION</text>
  <text x="515" y="185" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">coverage + numeric</text>

  <!-- Arrow to answer -->
  <line x1="565" y1="175" x2="600" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrG2)"/>

  <!-- Answer -->
  <rect x="600" y="145" width="160" height="100" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="165" text-anchor="middle" fill="#10b981" font-size="9" font-family="monospace" font-weight="600">ANSWER + PROVENANCE</text>
  <text x="680" y="180" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">table + chart</text>
  <text x="680" y="193" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">cited cells</text>
  <text x="680" y="206" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">generated SQL</text>
  <text x="680" y="219" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">snapshot link</text>
  <text x="680" y="232" text-anchor="middle" fill="#6ee7b7" font-size="8" font-family="monospace">accepted contract</text>

  <!-- AMBIGUOUS path -->
  <line x1="160" y1="210" x2="195" y2="210" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="195" y="198" width="110" height="24" rx="5" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="250" y="213" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="monospace">GOVERNED AI PLANNER</text>
  <!-- AI planner connects back to contract -->
  <line x1="305" y1="210" x2="340" y2="210" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="340" y1="210" x2="340" y2="195" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrG2)"/>

  <!-- UNSAFE path -->
  <line x1="160" y1="235" x2="225" y2="235" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrR)"/>
  <rect x="225" y="224" width="80" height="22" rx="5" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
  <text x="265" y="238" text-anchor="middle" fill="#f87171" font-size="8" font-family="monospace">CLEAR REFUSAL</text>

  <!-- Stat row -->
  <rect x="40" y="340" width="170" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="125" y="364" text-anchor="middle" fill="#3b82f6" font-size="20" font-family="system-ui" font-weight="700">156/156</text>
  <text x="125" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">browser matrix cells passed</text>
  <text x="125" y="392" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">(Chromium, Firefox, WebKit)</text>

  <rect x="225" y="340" width="170" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="310" y="364" text-anchor="middle" fill="#10b981" font-size="20" font-family="system-ui" font-weight="700">0 unverified</text>
  <text x="310" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">SQL executions by the model</text>
  <text x="310" y="392" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">engine owns all SQL</text>

  <rect x="410" y="340" width="170" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="495" y="364" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="system-ui" font-weight="700">5 states</text>
  <text x="495" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">rule resolver outputs</text>
  <text x="495" y="392" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">most paths: no LLM call</text>

  <rect x="595" y="340" width="165" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="677" y="364" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="system-ui" font-weight="700">4 audit modes</text>
  <text x="677" y="381" text-anchor="middle" fill="#64748b" font-size="9" font-family="system-ui">Governed / Deterministic</text>
  <text x="677" y="392" text-anchor="middle" fill="#64748b" font-size="8" font-family="system-ui">AI / Side-by-side compare</text>
</svg>
