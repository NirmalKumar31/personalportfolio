<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06101e"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Dot grid -->
  <pattern id="dots2" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#0f2040"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots2)" opacity="0.8"/>

  <!-- Glow behind central element -->
  <ellipse cx="400" cy="225" rx="120" ry="80" fill="#1d4ed8" opacity="0.06" filter="url(#glow2)"/>

  <!-- Central flow diagram: Q → contract → DuckDB → check → A -->
  <g transform="translate(400, 228)">
    <!-- Question node -->
    <rect x="-190" y="-26" width="70" height="52" rx="10" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="-155" y="-8" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="monospace">question</text>
    <text x="-155" y="8" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">natural lang</text>
    <text x="-155" y="20" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">input</text>

    <!-- Arrow 1 -->
    <line x1="-120" y1="0" x2="-96" y2="0" stroke="#1d4ed8" stroke-width="1.5"/>
    <polygon points="-96,0 -102,-4 -102,4" fill="#1d4ed8"/>

    <!-- Rule resolver node -->
    <rect x="-94" y="-26" width="72" height="52" rx="10" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="-58" y="-6" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="monospace">resolve</text>
    <text x="-58" y="8" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">5 states</text>
    <text x="-58" y="20" text-anchor="middle" fill="#3b82f6" font-size="8" font-family="monospace">EXACT/AMB...</text>

    <!-- Arrow 2 -->
    <line x1="-22" y1="0" x2="2" y2="0" stroke="#1d4ed8" stroke-width="1.5"/>
    <polygon points="2,0 -4,-4 -4,4" fill="#1d4ed8"/>

    <!-- DuckDB node (center, slightly larger) -->
    <rect x="4" y="-30" width="72" height="60" rx="10" fill="url(#nodeGrad)" opacity="0.9"/>
    <text x="40" y="-8" text-anchor="middle" fill="#fff" font-size="11" font-family="monospace" font-weight="600">DuckDB</text>
    <text x="40" y="8" text-anchor="middle" fill="#bfdbfe" font-size="9" font-family="monospace">read-only</text>
    <text x="40" y="22" text-anchor="middle" fill="#bfdbfe" font-size="9" font-family="monospace">MCP</text>

    <!-- Arrow 3 -->
    <line x1="76" y1="0" x2="100" y2="0" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="100,0 94,-4 94,4" fill="#10b981"/>

    <!-- Verify node -->
    <rect x="102" y="-26" width="72" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="138" y="-6" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="monospace">verify</text>
    <text x="138" y="8" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">coverage</text>
    <text x="138" y="20" text-anchor="middle" fill="#475569" font-size="9" font-family="monospace">+ numeric</text>

    <!-- Arrow 4 -->
    <line x1="174" y1="0" x2="196" y2="0" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="196,0 190,-4 190,4" fill="#10b981"/>

    <!-- Answer node -->
    <rect x="198" y="-30" width="70" height="60" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <!-- Checkmark -->
    <polyline points="214,0 224,12 244,-10" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="233" y="28" text-anchor="middle" fill="#6ee7b7" font-size="9" font-family="monospace">cited</text>
  </g>

  <!-- Label below flow -->
  <text x="400" y="310" text-anchor="middle" fill="#334155" font-size="10" font-family="monospace">model never executes SQL · engine owns all arithmetic · every answer is verifiable</text>

  <!-- Top label -->
  <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="system-ui" letter-spacing="0.12em">PERSONAL PROJECT</text>

  <!-- Title -->
  <text x="400" y="122" text-anchor="middle" fill="#f8fafc" font-size="26" font-family="system-ui" font-weight="700">Agentic Analytics Engine</text>
  <text x="400" y="148" text-anchor="middle" fill="#64748b" font-size="13" font-family="system-ui">Governed Q&amp;A over structured data — no unverified SQL</text>

  <!-- Bottom tag strip -->
  <rect x="0" y="400" width="800" height="50" fill="#040c18"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#0f1e35" stroke-width="1"/>

  <g font-family="system-ui" font-size="11" fill="#475569">
    <text x="56" y="431">LangGraph</text>
    <circle cx="126" cy="427" r="1.5" fill="#1e293b"/>
    <text x="136" y="431">DuckDB</text>
    <circle cx="195" cy="427" r="1.5" fill="#1e293b"/>
    <text x="205" y="431">FastAPI</text>
    <circle cx="257" cy="427" r="1.5" fill="#1e293b"/>
    <text x="267" y="431">React</text>
    <circle cx="305" cy="427" r="1.5" fill="#1e293b"/>
    <text x="315" y="431">TypeScript</text>
    <circle cx="386" cy="427" r="1.5" fill="#1e293b"/>
    <text x="396" y="431">MCP</text>
    <circle cx="427" cy="427" r="1.5" fill="#1e293b"/>
    <text x="437" y="431">Python</text>
  </g>

  <!-- Blue accent line -->
  <rect x="0" y="0" width="800" height="3" fill="#1d4ed8" opacity="0.7"/>
</svg>
